<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <title>Conceptual cell-state transitions</title>
  <desc>Three cells sit on the terrain. The left cell rests along the mountain ridge without a trajectory. The blue cell follows a dashed path over the basin's right rim and down its inner wall. The green cell follows a dashed path down the left wall, flattening toward the bowl floor. Each basin trajectory carries exactly one cell.</desc>
  <defs>
    <radialGradient id="cell-sphere" cx="32%" cy="25%" r="79%">
      <stop offset="0" stop-color="#e3ede7"/>
      <stop offset=".28" stop-color="#bdd5d8"/>
      <stop offset=".62" stop-color="#739bac"/>
      <stop offset="1" stop-color="#386b83"/>
    </radialGradient>
    <radialGradient id="cell-sphere-celadon" cx="32%" cy="25%" r="79%">
      <stop offset="0" stop-color="#eef0df"/>
      <stop offset=".28" stop-color="#d4dfca"/>
      <stop offset=".62" stop-color="#91afa2"/>
      <stop offset="1" stop-color="#527b73"/>
    </radialGradient>
    <linearGradient id="transition-ink" x1="1166" y1="533" x2="1042" y2="648" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#547c8c" stop-opacity=".35"/>
      <stop offset=".22" stop-color="#547c8c" stop-opacity=".48"/>
      <stop offset=".67" stop-color="#365f79" stop-opacity=".70"/>
      <stop offset="1" stop-color="#365f79" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="green-basin-ink" x1="1269" y1="541" x2="1416" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#567b72" stop-opacity=".30"/>
      <stop offset=".22" stop-color="#567b72" stop-opacity=".42"/>
      <stop offset=".67" stop-color="#567b72" stop-opacity=".62"/>
      <stop offset="1" stop-color="#567b72" stop-opacity=".32"/>
    </linearGradient>
    <radialGradient id="cell-shadow">
      <stop offset="0" stop-color="#355d70" stop-opacity=".24"/>
      <stop offset="1" stop-color="#355d70" stop-opacity="0"/>
    </radialGradient>
    <marker id="blue-direction" viewBox="-7 -5 9 10" refX="0" refY="0" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M-6 -3.5 L0 0 L-6 3.5" fill="none" stroke="#365f79" stroke-opacity=".42" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="green-direction" viewBox="-7 -5 9 10" refX="0" refY="0" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M-6 -3.5 L0 0 L-6 3.5" fill="none" stroke="#567b72" stroke-opacity=".40" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- All coordinates use the landscape-state.png canvas; keep this overlay
       inside terrain-camera and share the science image's registration transform. -->
  <!-- The ridge cell has no path; each basin path carries one cell. -->
  <g id="slope-cell">
    <ellipse cx="512" cy="516.5" rx="14" ry="4" fill="url(#cell-shadow)"/>
    <circle class="cell" cx="512" cy="506" r="10.5" fill="url(#cell-sphere-celadon)"
      stroke="#527b73" stroke-opacity=".65" stroke-width=".95"/>
    <path d="M506.5 500.5 C508 498.5 510.5 497.5 512 498.5" fill="none"
      stroke="#f5f5e8" stroke-opacity=".58" stroke-width="1.1" stroke-linecap="round"/>
  </g>
  <g id="blue-basin-transition">
    <path class="cell-trajectory" d="M1166 533 C1182 539 1195 553 1193 572 C1192 585 1178 598 1158 608 C1128 625 1086 641 1042 648"
      fill="none" stroke="url(#transition-ink)" stroke-width="2.1" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#blue-direction)"/>
    <ellipse cx="1158" cy="619" rx="15" ry="4.2" fill="url(#cell-shadow)"/>
    <circle class="cell" cx="1158" cy="608" r="11" fill="url(#cell-sphere)"
      stroke="#416a7e" stroke-opacity=".72" stroke-width="1"/>
    <path d="M1152 602 C1153 600 1156 599 1158 600" fill="none"
      stroke="#eff3e9" stroke-opacity=".58" stroke-width="1.1" stroke-linecap="round"/>
  </g>
  <g id="green-basin-transition">
    <path class="cell-trajectory" d="M1269 541 C1261 553 1265 572 1282 586 C1294 600 1315 611 1337 616 C1364 623 1391 625 1416 620"
      fill="none" stroke="url(#green-basin-ink)" stroke-width="2.1" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#green-direction)"/>
    <ellipse cx="1337" cy="626" rx="13.5" ry="3.8" fill="url(#cell-shadow)"/>
    <circle class="cell" cx="1337" cy="616" r="10" fill="url(#cell-sphere-celadon)"
      stroke="#527b73" stroke-opacity=".65" stroke-width=".95"/>
    <path d="M1332 610.5 C1333.5 608.5 1335.5 608 1337 609" fill="none"
      stroke="#f5f5e8" stroke-opacity=".58" stroke-width="1.1" stroke-linecap="round"/>
  </g>
</svg>
